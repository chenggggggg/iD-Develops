name: iddev-staging

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iddev_web_staging
    restart: unless-stopped
    ports:
      - "5001:8080"
    env_file:
      - .env.staging
    environment:
      ASPNETCORE_ENVIRONMENT: "Staging"
      ConnectionStrings__ApplicationDbContextConnection: "Host=postgres;Port=5432;Database=${DB_NAME:-iddevelops_staging};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};"
      Storage__Provider: "R2"
      Storage__Prefix: "${Storage__Prefix:-staging}"
    volumes:
      - data_protection_staging_keys:/app/App_Data/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: iddev_postgres_staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      POSTGRES_DB: "${DB_NAME:-iddevelops_staging}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5434:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_staging_data:
  data_protection_staging_keys:



